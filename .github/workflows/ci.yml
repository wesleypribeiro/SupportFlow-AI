name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# O CI não precisa de segredos, tokens de provedores nem permissões de escrita.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: npm 11
        run: npm install --global npm@11

      - name: Instalar dependências do lockfile
        run: npm ci

      - name: Testes
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  proxy:
    name: proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar Nginx e OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx openssl

      - name: Validar proxy HTTPS real com dados fictícios
        run: node deploy/whatsapp/verify-proxy.mjs
