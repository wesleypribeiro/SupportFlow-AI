# Instância dedicada: não incluir configurações de outros sites/serviços.
# Manter nginx.conf e certificados no diretório de runtime passado a nginx -p.
worker_processes 1;
pid logs/whatsapp-proxy.pid;
# O error_log nativo pode conter URL/query e headers; não tem redação por campo.
error_log /dev/null;

events {
    worker_connections 128;
}

http {
    # Somente constantes e medidas geradas pelo proxy, nunca dados do visitante.
    log_format whatsapp_safe escape=json
        '{"code":"WHATSAPP_PROXY_REQUEST","status":$status,"duration":$request_time}';
    access_log logs/whatsapp-access.log whatsapp_safe;
    server_tokens off;
    client_body_temp_path body-temp;
    proxy_temp_path proxy-temp;

    # Validar URI ORIGINAL também impede aliases por encoding, // ou segmentos ..
    # O delimitador da query é aceito pelo padrão abaixo, sem registrá-la.
    map "$request_method:$request_uri" $whatsapp_webhook_allowed {
        default 0;
        ~^(GET|POST):/webhooks/whatsapp/meta([?].*)?$ 1;
    }

    server {
        # O túnel HTTPS deve encaminhar SOMENTE a esta porta, nunca 3000/3001.
        listen 127.0.0.1:8443 ssl;
        server_name _;
        ssl_certificate certificate.pem;
        ssl_certificate_key private-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 1m;
        client_body_buffer_size 1m;
        if ($whatsapp_webhook_allowed = 0) { return 403; }

        location = /webhooks/whatsapp/meta {
            # Sem URI no proxy_pass: preserva query e bytes assinados do corpo.
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Request-ID "";
        }

        location / { return 403; }
    }
}
